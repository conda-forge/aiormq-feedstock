schema_version: 1

context:
  name: aiormq
  version: "7.2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 5fd20bb9583d73de85572198496b65cf028f27527c1733c9840d458e0b40e8fa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.12.19,<0.13
  run:
    - python >=${{ python_min }}
    - pamqp >=4,<5
    - yarl

tests:
  - python:
      imports:
        - aiormq
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: COPYING
  summary: aiormq is a pure python AMQP client library
  description: |
    aiormq is a pure python AMQP client library
  homepage: https://github.com/mosquito/aiormq
  repository: https://github.com/mosquito/aiormq
  documentation: https://github.com/mosquito/aiormq

extra:
  recipe-maintainers:
    - akrherz
    - gregfreeman
    - sphuber
    - pb01ka
