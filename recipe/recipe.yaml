schema_version: 1

context:
  name: aiormq
  version: "7.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f8447b89d9c593bc14647db8daa3e836015a5c054be707161e971da21726c65c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - pamqp >=4,<5
    - yarl

tests:
  - python:
      imports:
        - aiormq
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: COPYING
  summary: aiormq is a pure python AMQP client library
  description: |
    aiormq is a pure python AMQP client library
  homepage: https://github.com/mosquito/aiormq
  repository: https://github.com/mosquito/aiormq
  documentation: https://github.com/mosquito/aiormq

extra:
  recipe-maintainers:
    - akrherz
    - gregfreeman
    - sphuber
    - pb01ka
